<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande envoyée · BG3d81</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#15191F; --muted:#56606C; --line:#D6DEE8;
  --accent:#0A66D6; --accent-ink:#FFFFFF; --sky:#0477C2; --tile:#434343;
  --f-brand:"Michroma", "Segoe UI", system-ui, sans-serif;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Consolas", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#232529; --surface:#2E3135; --ink:#ECEFF3; --muted:#A3ABB5; --line:#3D4248;
  --accent:#45B4FF; --accent-ink:#0B1520; --sky:#6CC6FF; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.6;
  display:grid;place-items:center;padding-block:32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px;height:48px;border-radius:10px;background:var(--tile);object-fit:cover}
.brand span{font-family:var(--f-brand);font-size:1rem}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--sky)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.btn{justify-self:start;display:inline-flex;padding:12px 20px;border-radius:8px;font-weight:600;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="img/logo-bg3d81-96.jpg" alt="" width="48" height="48"><span>BG3d81</span></div>
    <span class="eyebrow">Demande envoyée</span>
    <h1>Merci, j'ai bien reçu votre demande.</h1>
    <p>Je l'étudie et je vous réponds par e-mail, en général sous 48 heures, avec un prix et un délai.</p>
    <p>Pensez à regarder vos courriers indésirables si vous ne voyez rien arriver.</p>
    <a class="btn" href="index.html">Retour au site</a>
  </main>
</body>
</html>
